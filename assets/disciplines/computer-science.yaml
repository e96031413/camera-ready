# Computer science and machine learning: the workflow's original home discipline.
discipline: computer-science
display_name: Computer science and machine learning
default_style: ieee
allowed_styles:
  - ieee
  - apa7
default_format: latex
document_class: IEEEtran
evidence_model: experimental

reporting_guidelines: []
required_sections:
  - Abstract
  - Introduction
  - Related Work
  - Method
  - Experiments
  - Limitations
  - Conclusion

ethics_approval_required: false
preregistration_expected: false
data_availability_required: true
code_availability_required: true
conflict_of_interest_required: false
funding_statement_required: false

peer_review_norm: conference-first, double-blind at the major venues
common_rejections:
  - Insufficient novelty over prior work
  - Missing or weak baselines
  - No error bars, seeds, or significance testing
  - Claims that exceed what the experiments measured

reference_url: https://neurips.cc/public/guides/PaperChecklist
notes: >
  The default profile. Conference papers dominate, page limits are hard, and
  the reviewer checklist is itself a gate. See assets/venues for the per-venue
  rules.
