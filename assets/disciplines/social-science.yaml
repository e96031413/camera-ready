# Sociology, political science, anthropology and adjacent fields.
discipline: social-science
display_name: Social science
default_style: chicago-author-date
allowed_styles:
  - chicago-author-date
  - apa7
  - mla9
default_format: docx
document_class: article
evidence_model: mixed-methods

reporting_guidelines:
  - coreq
  - srqr
  - cherries
  - strobe
  - prisma2020
required_sections:
  - Abstract
  - Introduction
  - Theoretical Framework
  - Data and Methods
  - Findings
  - Discussion
  - References

ethics_approval_required: true
preregistration_expected: false
data_availability_required: true
code_availability_required: true
conflict_of_interest_required: true
funding_statement_required: true

peer_review_norm: journal, double-anonymized
common_rejections:
  - Sampling and case selection not justified against the claim's scope
  - Positionality and reflexivity absent in interpretive work
  - Measures presented without construct validation
  - Findings generalized beyond the population studied

reference_url: https://www.chicagomanualofstyle.org/tools_citationguide.html
notes: >
  Quantitative and qualitative strands have different reporting guidelines;
  pick per strand rather than per paper. Anonymize field sites and participants
  consistently, and say how you did it.
